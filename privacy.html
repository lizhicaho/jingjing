<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隐私政策 · 我想静静</title><link rel="stylesheet" href="legal.css"><main class="page"><a class="back" href="/">← 回到静心</a><h1>隐私政策</h1><small>最后更新：2026 年 8 月 5 日</small><div class="card"><p>《我想静静》尊重你的安静，也尊重你的隐私。我们不要求注册、不会收集姓名、手机号、照片或烦恼签内容。</p></div><h2>本地数据</h2><p>今日进度、累计静心、连续天数、音效偏好和烦恼签仅保存在当前浏览器。照片只在本次会话中临时使用，关闭页面后不会上传或保存。</p><h2>匿名道场数据</h2><p>启用线上统计后，服务端仅记录随机匿名设备标识、访问时间和有效敲击计数，用于展示匿名道场数据。我们不将其用于识别个人。</p><h2>你的选择</h2><p>清除浏览器站点数据即可移除本地记录。对隐私有任何疑问，请通过 <a href="https://github.com/lizhicaho/jingjing/issues">GitHub Issues</a> 联系我们。</p></main></html>
