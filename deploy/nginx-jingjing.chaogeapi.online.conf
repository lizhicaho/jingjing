server {
    listen 80;
    listen [::]:80;
    server_name jingjing.chaogeapi.online;

    return 301 https://jingjing.chaogeapi.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jingjing.chaogeapi.online;

    root /var/www/jingjing;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/jingjing.chaogeapi.online/jingjing.chaogeapi.online_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/jingjing.chaogeapi.online/jingjing.chaogeapi.online.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /stats-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # 微信等内置浏览器可能长时间缓存入口页；HTML 始终重新校验，
    # CSS / JS 则通过文件名后的版本号实现高效缓存。
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /api/stats.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|oga|png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
