server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name chaogeapi.online www.chaogeapi.online;

    # 所有 HTTP 访问统一跳转至主域名 HTTPS，避免证书域名不匹配。
    return 301 https://chaogeapi.online$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name chaogeapi.online www.chaogeapi.online;

    root /var/www/jingjing;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/chaogeapi.online/chaogeapi.online_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/chaogeapi.online/chaogeapi.online.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /stats-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|oga|png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
